<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101f26">
  <meta name="description" content="Altı Anadolu beyliği, yaşayan bir savaş alanı. Hisarını kur, taburlarını yönet, beylerinle Anadolu’ya hükmet.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Gölge Kuşatması</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./src/client/style.css">
  <link rel="modulepreload" crossorigin href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js">
</head>
<body>
  <main id="app" aria-label="Gölge Kuşatması">
    <div id="world"><canvas id="battlefield" aria-label="Üç boyutlu savaş alanı"></canvas></div>
    <div class="vignette" aria-hidden="true"></div>
    <div id="hud" hidden></div>
    <div id="screen"></div>
    <div id="modal" hidden></div>
    <div id="notices" role="status" aria-live="polite" aria-atomic="false"></div>
    <div id="selection-box" hidden aria-hidden="true"></div>
    <div id="boot" role="status">
      <div class="boot-seal" aria-hidden="true">✧</div>
      <h1>Gölge Kuşatması</h1>
      <p id="boot-message">Sancaklar hazırlanıyor…</p>
      <small>İlk açılışta üç boyutlu çizim bileşeni için internet gerekir.</small>
    </div>
  </main>
  <noscript>Gölge Kuşatması için JavaScript’i açın ve oyunu HTTP(S) üzerinden çalıştırın.</noscript>
  <script type="module" src="./src/client/boot.js"></script>
</body>
</html>
